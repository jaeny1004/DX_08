<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      lang이 en으로 잘못 선언되어 있어 Chrome이 한국어 본문을 외국어로 보고
      자동 번역을 실행했다. 번역기가 React가 관리하는 텍스트 노드를 교체하면
      이후 React의 removeChild가 실패해 화면 전체가 흰 화면으로 죽는다.
      lang을 ko로 바로잡고, 번역 대상이 되지 않도록 명시한다.
    -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI 기반 소나무재선충병 통합 예찰·방제지원 플랫폼</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
